[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-ai"
version = "3.0.0"
description = "A modular local-first AI assistant"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
ai = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.34"]
memory = ["sentence-transformers>=3.0", "numpy>=1.26"]
documents = ["pypdf>=4.0", "python-docx>=1.1"]
search = ["ddgs>=6.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["pixel*"]
exclude = ["tests*", "plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
